<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12.0 -12.0 392.0 322.0" font-size="14" width="392" height="322"><rect x="-12.0" y="-12.0" width="392.0" height="322.0" rx="8" fill="#ffffff"></rect>
  <rect x="0" y="0" width="368" height="298" rx="8" fill="#ffffff"></rect>
  <rect x="12" y="12" width="344" height="274" rx="8" fill="#ffffff"></rect>
  <rect x="24" y="24" width="320" height="250" rx="7.2" fill="#ffffff"></rect>
  
  <style>
    .label { font-family: sans-serif; font-size: 14px; fill: #1f2937; }
    .line { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .dashed { stroke-dasharray: 5 5; }
    .pyramid-fill { fill: #D4EDDA; fill-opacity: 0.7; }
  </style>

  <!-- Cube edges (corrected to use line elements and correctly mark dashed lines) -->
  <!-- Dashed lines first for proper layering -->
  <line class="line dashed" x1="144" y1="174" x2="84" y2="224"></line> <!-- D A -->
  <line class="line dashed" x1="144" y1="74" x2="84" y2="124"></line> <!-- H E -->
  <line class="line dashed" x1="144" y1="124" x2="144" y2="74"></line> <!-- S H -->

  <!-- Solid cube edges -->
  <line class="line" x1="84" y1="224" x2="244" y2="224"></line> <!-- A B -->
  <line class="line" x1="244" y1="224" x2="304" y2="174"></line> <!-- B C -->
  <line class="line" x1="304" y1="174" x2="144" y2="174"></line> <!-- C D -->

  <line class="line" x1="84" y1="124" x2="244" y2="124"></line> <!-- E F -->
  <line class="line" x1="244" y1="124" x2="304" y2="74"></line> <!-- F G -->
  <line class="line" x1="304" y1="74" x2="144" y2="74"></line> <!-- G H -->

  <line class="line" x1="84" y1="224" x2="84" y2="124"></line> <!-- A E -->
  <line class="line" x1="244" y1="224" x2="244" y2="124"></line> <!-- B F -->
  <line class="line" x1="304" y1="174" x2="304" y2="74"></line> <!-- C G -->
  <line class="line" x1="144" y1="174" x2="144" y2="124"></line> <!-- D S -->

  <!-- Pyramid ACDS faces (fill) -->
  <polygon class="pyramid-fill" points="84,224 144,174 144,124"></polygon> <!-- A D S -->
  <polygon class="pyramid-fill" points="304,174 144,174 144,124"></polygon> <!-- C D S -->
  <polygon class="pyramid-fill" points="84,224 304,174 144,124"></polygon> <!-- A C S -->

  <!-- Pyramid ACDS edges (stroke) -->
  <line class="line" x1="84" y1="224" x2="144" y2="124"></line> <!-- A S -->
  <line class="line" x1="304" y1="174" x2="144" y2="124"></line> <!-- C S -->
  <line class="line" x1="84" y1="224" x2="304" y2="174"></line> <!-- A C -->

  <!-- Labels -->
  <text x="74" y="239" class="label">A</text>
  <text x="234" y="239" class="label">B</text>
  <text x="314" y="189" class="label">C</text>
  <text x="129" y="184" class="label">D</text>

  <text x="74" y="139" class="label">E</text>
  <text x="234" y="139" class="label">F</text>
  <text x="314" y="89" class="label">G</text>
  <text x="134" y="89" class="label">H</text>

  <text x="129" y="134" class="label">S</text>
</svg>