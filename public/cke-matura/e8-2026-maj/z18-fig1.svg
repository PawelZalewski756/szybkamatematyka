<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <style>
    .label { font-family: sans-serif; font-size: 16px; fill: #1f2937; }
    .line { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .pyramid-fill { fill: #D4EDDA; fill-opacity: 0.7; }
  </style>

  <!-- Cube edges -->
  <path class="line" d="M 60 200 L 220 200 L 280 150 L 120 150 L 60 200"/>
  <path class="line" d="M 60 100 L 220 100 L 280 50 L 120 50 L 60 100"/>
  <line class="line" x1="60" y1="200" x2="60" y2="100"/>
  <line class="line" x1="220" y1="200" x2="220" y2="100"/>
  <line class="line" x1="280" y1="150" x2="280" y2="50"/>
  <line class="line" x1="120" y1="150" x2="120" y2="50"/>

  <!-- Pyramid ACDS faces (fill) -->
  <polygon class="pyramid-fill" points="60,200 120,150 280,150"/>
  <polygon class="pyramid-fill" points="60,200 120,150 120,100"/>
  <polygon class="pyramid-fill" points="280,150 120,150 120,100"/>
  <polygon class="pyramid-fill" points="60,200 280,150 120,100"/>

  <!-- Pyramid ACDS edges (stroke) -->
  <line class="line" x1="60" y1="200" x2="120" y2="100"/>
  <line class="line" x1="280" y1="150" x2="120" y2="100"/>
  <line class="line" x1="60" y1="200" x2="280" y2="150"/>

  <!-- Labels -->
  <text x="50" y="215" class="label">A</text>
  <text x="210" y="215" class="label">B</text>
  <text x="290" y="165" class="label">C</text>
  <text x="110" y="165" class="label">D</text>

  <text x="50" y="115" class="label">E</text>
  <text x="210" y="115" class="label">F</text>
  <text x="290" y="65" class="label">G</text>
  <text x="110" y="65" class="label">H</text>

  <text x="100" y="105" class="label">S</text>
</svg>