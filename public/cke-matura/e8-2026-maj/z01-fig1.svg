<svg xmlns="http://www.w3.org/2000/svg" viewBox="-39.8 -12.0 454.0 374.0" font-size="14" width="454" height="374"><rect x="-39.8" y="-12.0" width="454.0" height="374.0" rx="8" fill="#ffffff"></rect>
  <rect x="0" y="0" width="400" height="350" fill="#ffffff"></rect>

  <!-- Pie chart slices - center (200, 170), radius 120 -->
  <!-- Angles are clockwise from 3 o'clock -->

  <!-- statystyka (20%) - from 330 to 42 degrees -->
  <path d="M 200 170 L 303.9230484541326 110 A 120 120 0 0 1 289.1729002271295 250.3134371981604 Z" fill="#805ad5" stroke="#1f2937" stroke-width="1"></path>
  <!-- algebra (25%) - from 42 to 132 degrees -->
  <path d="M 200 170 L 289.1729002271295 250.3134371981604 A 120 120 0 0 1 110.8270997728705 250.3134371981604 Z" fill="#a7d99f" stroke="#1f2937" stroke-width="1"></path>
  <!-- planimetria (15%) - from 132 to 186 degrees -->
  <path d="M 200 170 L 110.8270997728705 250.3134371981604 A 120 120 0 0 1 96.07695154586733 89.6865628018396 Z" fill="#808080" stroke="#1f2937" stroke-width="1"></path>
  <!-- stereometria (5%) - from 186 to 204 degrees -->
  <path d="M 200 170 L 96.07695154586733 89.6865628018396 A 120 120 0 0 1 106.90696956795022 68.61868470500732 Z" fill="#facc15" stroke="#1f2937" stroke-width="1"></path>
  <!-- arytmetyka (35%) - from 204 to 330 degrees -->
  <path d="M 200 170 L 106.90696956795022 68.61868470500732 A 120 120 0 0 1 303.9230484541326 110 Z" fill="#b3cde0" stroke="#1f2937" stroke-width="1"></path>

  <!-- Labels and Leader Lines -->

  <!-- Statystyka -->
  <text x="340" y="70" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start">statystyka</text>
  <text x="340" y="90" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start">20%</text>
  <path d="M 319.34 182.54 L 330 100 L 340 63" fill="none" stroke="#1f2937" stroke-width="1"></path>

  <!-- Algebra -->
  <text x="330" y="280" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start">algebra</text>
  <text x="330" y="300" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start">25%</text>
  <path d="M 206.28 289.83 L 280 290 L 330 273" fill="none" stroke="#1f2937" stroke-width="1"></path>

  <!-- Planimetria -->
  <text x="70" y="300" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="end">planimetria</text>
  <text x="70" y="320" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="end">15%</text>
  <path d="M 87.97 213 L 120 280 L 70 293" fill="none" stroke="#1f2937" stroke-width="1"></path>

  <!-- Stereometria -->
  <text x="50" y="180" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="end">stereometria</text>
  <text x="50" y="200" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="end">5%</text>
  <path d="M 84.1 138.95 L 60 160 L 50 173" fill="none" stroke="#1f2937" stroke-width="1"></path>

  <!-- Arytmetyka -->
  <text x="50" y="80" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="end">arytmetyka</text>
  <path d="M 193.72 50.17 L 120 60 L 50 73" fill="none" stroke="#1f2937" stroke-width="1"></path>
</svg>