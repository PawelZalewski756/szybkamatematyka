<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <g transform="translate(0, 0)">
    <!-- Pie chart slices - center (180, 200), radius 120 -->
    <!-- statystyka (20%) - from 330 to 42 degrees -->
    <path d="M 180 200 L 283.9230484541326 140 A 120 120 0 0 1 269.1729002271295 280.3134371981604 Z" fill="#805ad5" stroke="#1f2937" stroke-width="1"/>
    <!-- algebra (25%) - from 42 to 132 degrees -->
