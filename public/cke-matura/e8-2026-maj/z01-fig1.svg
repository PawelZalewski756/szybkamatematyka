    <!-- planimetria (15%) - from 132 to 186 degrees -->
    <path d="M 180 200 L 99.6918882736152 289.1729002271295 A 120 120 0 0 1 60.66012678129032 187.4373406450537 Z" fill="#808080" stroke="#1f2937" stroke-width="1"/>
    <!-- stereometria (5%) - from 186 to 204 degrees -->
    <path d="M 180 200 L 60.66012678129032 187.4373406450537 A 120 120 0 0 1 70.57469792015093 151.21886866160868 Z" fill="#facc15" stroke="#1f2937" stroke-width="1"/>
    <!-- arytmetyka (35%) - from 204 to 330 degrees -->
    <path d="M 180 200 L 70.57469792015093 151.21886866160868 A 120 120 0 0 1 283.9230484541326 140 Z" fill="#b3cde0" stroke="#1f2937" stroke-width="1"/>
  </g>
  <!-- Labels -->
  <text x="380" y="50" font-family="sans-serif" font-size="16" fill="#1f2937">statystyka</text>
  <text x="380" y="70" font-family="sans-serif" font-size="16" fill="#1f2937">20%</text>
  <path d="M 370 70 L 320 100 L 299.3400593006001 212.5626593549463" fill="none" stroke="#1f2937" stroke-width="1"/>
  
  <text x="380" y="280" font-family="sans-serif" font-size="16" fill="#1f2937">algebra</text>
  <text x="380" y="300" font-family="sans-serif" font-size="16" fill="#1f2937">25%</text>
  <path d="M 370 290 L 300 250 L 186.2766355416345 319.8338902517036" fill="none" stroke="#1f2937" stroke-width="1"/>

  <text x="250" y="350" font-family="sans-serif" font-size="16" fill="#1f2937">planimetria</text>
  <text x="250" y="370" font-family="sans-serif" font-size="16" fill="#1f2937">15%</text>
  <path d="M 240 360 L 150 300 L 69.00418318621453 243.90159787140884" fill="none" stroke="#1f2937" stroke-width="1"/>

