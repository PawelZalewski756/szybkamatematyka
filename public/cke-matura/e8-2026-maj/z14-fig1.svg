<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.3 -4.3 108.6 168.6" font-family="sans-serif" font-size="14" width="304" height="472"><rect x="-4.3" y="-4.3" width="108.6" height="168.6" rx="2.9" fill="#ffffff"></rect>
