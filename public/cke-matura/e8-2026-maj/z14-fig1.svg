<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <g stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round">
    <!-- Filled faces -->
    <polygon fill="#d6f7d6" stroke="none" points="15,20 55,20 75,8 35,8"/>
    <polygon fill="#d6f7d6" stroke="none" points="15,20 55,20 55,140 15,140"/>
    <polygon fill="#d6f7d6" stroke="none" points="55,20 75,8 75,128 55,140"/>

    <!-- Solid lines -->
    <path d="M15,20 L55,20 L55,140 L15,140 Z"/>
    <path d="M15,20 L35,8"/>
    <path d="M55,20 L75,8"/>
    <path d="M35,8 L75,8"/>
    
    <line x1="15" y1="60" x2="55" y2="60"/>
    <line x1="15" y1="100" x2="55" y2="100"/>

    <!-- Dashed lines -->
    <g stroke-dasharray="5 5">
      <path d="M15,140 L35,128"/>
      <path d="M55,140 L75,128"/>
      <path d="M35,128 L75,128"/>
      <path d="M35,8 L35,128"/>
      <path d="M75,8 L75,128"/>

      <line x1="35" y1="48" x2="75" y2="48"/>
      <line x1="35" y1="88" x2="75" y2="88"/>
    </g>
  </g>
</svg>