<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12.0 -12.0 424.0 374.0" font-family="sans-serif" font-size="14" width="424" height="374"><rect x="-12.0" y="-12.0" width="424.0" height="374.0" rx="8" fill="#ffffff"></rect>
  <rect x="0" y="0" width="400" height="350" rx="8" fill="#ffffff"></rect>
  
  <!-- Isosceles Triangle (Flowerbed) -->
  <path d="M 100 265 L 300 265 L 200 115 Z" fill="#cccccc" stroke="#1f2937" stroke-width="2"></path>
  <!-- Inscribed Circle (Fontanna) -->
  <circle cx="200" cy="211.5" r="53.5" stroke="#8b5cf6" stroke-dasharray="8 4" fill="none" stroke-width="2"></circle>
  <!-- Label 'x' for the base -->
  <text x="200" y="290" text-anchor="middle" fill="#1f2937">x</text>
  <!-- Surrounding Path (Black Lines) -->
  <!-- Bottom horizontal segments -->
  <path d="M 50 295 H 100 M 300 295 H 350" stroke="#1f2937" stroke-width="2" fill="none"></path>
  <path d="M 50 305 H 100 M 300 305 H 350" stroke="#1f2937" stroke-width="2" fill="none"></path>
  <!-- Angled lines connecting bottom outer to top outer point -->
  <path d="M 50 295 L 200 95 M 350 295 L 200 95" stroke="#1f2937" stroke-width="2" fill="none"></path>
  <!-- Vertical lines at the top of the 'funnel' forming an opening -->
  <path d="M 195 95 V 45 M 205 95 V 45" stroke="#1f2937" stroke-width="2" fill="none"></path>
</svg>