<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <!-- Isosceles Triangle (Flowerbed) -->
  <path d="M 150 250 L 350 250 L 250 100 Z" fill="#cccccc" stroke="#1f2937" stroke-width="2"/>
  <!-- Inscribed Circle (Fontanna) -->
  <!-- Based on a triangle with base 200 units and height 150 units, inradius is approx 53.5 units. -->
  <circle cx="250" cy="196.5" r="53.5" stroke="#8b5cf6" stroke-dasharray="8 4" fill="none" stroke-width="2"/>
  <!-- Label 'x' for the base -->
  <text x="250" y="275" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#1f2937">x</text>
  <!-- Surrounding Path (Black Lines) -->
  <!-- Bottom horizontal segments -->
  <path d="M 100 280 H 150 M 350 280 H 400" stroke="#1f2937" stroke-width="2" fill="none"/>
  <path d="M 100 290 H 150 M 350 290 H 400" stroke="#1f2937" stroke-width="2" fill="none"/>
  <!-- Angled lines connecting bottom outer to top outer point -->
  <path d="M 100 280 L 250 80 M 400 280 L 250 80" stroke="#1f2937" stroke-width="2" fill="none"/>
  <!-- Vertical lines at the top of the 'funnel' -->
  <path d="M 250 100 V 50 M 250 80 V 30" stroke="#1f2937" stroke-width="2" fill="none"/>
</svg>