<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <!-- Square ABCD (A bottom-left, D top-left) -->
  <!-- A=(50,350) B=(350,350) C=(350,50) D=(50,50) -->
  <path d="M 50 50 L 350 50 L 350 350 L 50 350 Z" stroke="#1f2937" stroke-width="2" fill="none"/>

  <!-- K midpoint of AB -->
  <!-- K=((50+350)/2, 350) = (200,350) -->

  <!-- L midpoint of BC -->
  <!-- L=(350, (350+50)/2) = (350,200) -->

  <!-- M on BC, DK perp KM -->
  <!-- D=(50,50), K=(200,350) => slope m_DK = (350-50)/(200-50) = 300/150 = 2 -->
  <!-- K=(200,350), M=(350, y_M) => slope m_KM = -1/2 -->
  <!-- y_M - 350 = -1/2 * (350 - 200) = -1/2 * 150 = -75 -->
  <!-- y_M = 350 - 75 = 275 -->
  <!-- M=(350, 275) -->

  <!-- Segments DK, KM, DM, AL (purple color from image) -->
  <path d="M 50 50 L 200 350" stroke="#8b5cf6" stroke-width="2" fill="none"/> <!-- DK -->
  <path d="M 200 350 L 350 275" stroke="#8b5cf6" stroke-width="2" fill="none"/> <!-- KM -->
  <path d="M 50 50 L 350 275" stroke="#8b5cf6" stroke-width="2" fill="none"/> <!-- DM -->
  <path d="M 50 350 L 350 200" stroke="#8b5cf6" stroke-width="2" fill="none"/> <!-- AL -->

  <!-- Intersection P (AL and DK) -->
  <!-- Line AL: y - 350 = -1/2 (x - 50) => y = -1/2 x + 375 -->
  <!-- Line DK: y - 50 = 2 (x - 50) => y = 2x - 50 -->
  <!-- -1/2 x + 375 = 2x - 50 => 425 = 5/2 x => x = 170 -->
  <!-- y = 2(170) - 50 = 340 - 50 = 290 -->
  <!-- P=(170, 290) -->
  <circle cx="170" cy="290" r="3" fill="#1f2937"/>

  <!-- Intersection Q (AL and DM) -->
  <!-- Line DM: D=(50,50), M=(350,275) => slope m_DM = (275-50)/(350-50) = 225/300 = 3/4 -->
  <!-- y - 50 = 3/4 (x - 50) => y = 3/4 x + 12.5 -->
  <!-- -1/2 x + 375 = 3/4 x + 12.5 => 362.5 = 5/4 x => x = 290 -->
  <!-- y = 3/4 (290) + 12.5 = 217.5 + 12.5 = 230 -->
  <!-- Q=(290, 230) -->
  <circle cx="290" cy="230" r="3" fill="#1f2937"/>

  <!-- Labels -->
  <text x="40" y="365" font-family="sans-serif" font-size="14" fill="#1f2937">A</text>
  <text x="360" y="365" font-family="sans-serif" font-size="14" fill="#1f2937">B</text>
  <text x="360" y="40" font-family="sans-serif" font-size="14" fill="#1f2937">C</text>
  <text x="40" y="40" font-family="sans-serif" font-size="14" fill="#1f2937">D</text>
  <text x="195" y="365" font-family="sans-serif" font-size="14" fill="#1f2937">K</text>
  <text x="360" y="205" font-family="sans-serif" font-size="14" fill="#1f2937">L</text>
  <text x="360" y="280" font-family="sans-serif" font-size="14" fill="#1f2937">M</text>
  <text x="160" y="280" font-family="sans-serif" font-size="14" fill="#1f2937">P</text>
  <text x="295" y="220" font-family="sans-serif" font-size="14" fill="#1f2937">Q</text>
  <text x="30" y="200" font-family="sans-serif" font-size="14" font-style="italic" fill="#1f2937">a</text>

  <!-- Right angle symbol at K for DK and KM -->
  <!-- K=(200,350) -->
  <!-- Vector KD: (-150, -300) => unit vector u_DK = (-1/sqrt(5), -2/sqrt(5)) -->
  <!-- Vector KM: (150, -75) => unit vector u_KM = (2/sqrt(5), -1/sqrt(5)) -->
  <!-- Arc points for radius 25: -->
  <!-- P1 = K + 25 * u_DK = (200 - 25/sqrt(5), 350 - 50/sqrt(5)) = (200 - 5*sqrt(5), 350 - 10*sqrt(5)) approx (188.82, 327.64) -->
  <!-- P2 = K + 25 * u_KM = (200 + 50/sqrt(5), 350 - 25/sqrt(5)) = (200 + 10*sqrt(5), 350 - 5*sqrt(5)) approx (222.36, 338.82) -->
  <path d="M 188.82 327.64 A 25 25 0 0 1 222.36 338.82" stroke="#1f2937" stroke-width="1.5" fill="none"/>

  <!-- Small square symbol inside the angle, centered slightly offset from K along the bisector -->
  <!-- Bisector unit vector: (u_DK + u_KM) / |u_DK + u_KM| = (1/sqrt(5), -3/sqrt(5)) / sqrt(1/5 + 9/5) = (1/sqrt(5), -3/sqrt(5)) / sqrt(2) = (1/sqrt(10), -3/sqrt(10)) -->
  <!-- Center of square K_c = K + 10 * (1/sqrt(10), -3/sqrt(10)) approx (200 + 3.16, 350 - 9.49) = (203.16, 340.51) -->
  <!-- Square of side 5, centered at K_c: x = K_c.x - 2.5, y = K_c.y - 2.5 -->
  <rect x="200.66" y="338.01" width="5" height="5" fill="#1f2937"/>
</svg>