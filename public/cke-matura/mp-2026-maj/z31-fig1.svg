<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12.0 -12.0 444.0 324.0" font-size="14" width="444" height="324"><rect x="-12.0" y="-12.0" width="444.0" height="324.0" rx="8" fill="#ffffff"></rect>
  <rect x="0" y="0" width="400" height="300" fill="#ffffff"></rect>
  
  <style>
    .label { font-family: sans-serif; font-size: 13px; fill: #1f2937; }
    .axis-label { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #1f2937; }
    .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #1f2937; }
    .grid { stroke: #1f2937; stroke-width: 0.5; }
    .axis { stroke: #1f2937; stroke-width: 1; }
    .bar { fill: #d4c8e7; stroke: #1f2937; stroke-width: 1; }
  </style>

  <g id="chart_content">
    <!-- Title: Centered horizontally over the plot area. Plot area width=320px. Left edge at x=100. Center at 100+160=260. Y-pos set for baseline, ensuring spacing from top. -->
    <text x="260" y="22" text-anchor="middle" class="title">klasa IV A</text>

    <!-- Y-axis label "liczba uczniów": Placed to the left of the Y-axis numbers. Rotated -90 degrees. X-pos set to prevent clipping, Y-pos centered vertically on plot area. -->
    <text x="50" y="140" transform="rotate(-90 50 140)" text-anchor="middle" class="axis-label">liczba uczniów</text>

    <!-- X-axis label "ocena": Placed below the X-axis numbers. Centered horizontally over the plot area. Y-pos adjusted to provide adequate spacing. -->
    <text x="260" y="276" text-anchor="middle" class="axis-label">ocena</text>

    <!-- Plotting area group: Coordinates (0,0) of this group correspond to the top-left corner of the grid (Y=7, X=0).
         This group is translated to (100, 35) within the viewBox to provide margins and space for labels. -->
    <g id="plot_area" transform="translate(100, 35)">
      <!-- Axis lines -->
      <line x1="0" y1="0" x2="0" y2="210" class="axis"></line> <!-- Y-axis -->
      <line x1="0" y1="210" x2="320" y2="210" class="axis"></line> <!-- X-axis -->

      <g class="label">
        <!-- Y-axis labels (0-7) and grid lines. Labels' Y-coordinates are adjusted to vertically center the text on the tick marks. (Font-size 13px, so baseline is tick_y + 6.5px). -->
        <text x="-5" y="216.5" text-anchor="end">0</text>
        <line x1="-3" y1="210" x2="0" y2="210" class="axis"></line>
        
        <text x="-5" y="186.5" text-anchor="end">1</text>
        <line x1="-3" y1="180" x2="0" y2="180" class="axis"></line>
        <line x1="0" y1="180" x2="320" y2="180" class="grid"></line>

        <text x="-5" y="156.5" text-anchor="end">2</text>
        <line x1="-3" y1="150" x2="0" y2="150" class="axis"></line>
        <line x1="0" y1="150" x2="320" y2="150" class="grid"></line>

        <text x="-5" y="126.5" text-anchor="end">3</text>
        <line x1="-3" y1="120" x2="0" y2="120" class="axis"></line>
        <line x1="0" y1="120" x2="320" y2="120" class="grid"></line>

        <text x="-5" y="96.5" text-anchor="end">4</text>
        <line x1="-3" y1="90" x2="0" y2="90" class="axis"></line>
        <line x1="0" y1="90" x2="320" y2="90" class="grid"></line>

        <text x="-5" y="66.5" text-anchor="end">5</text>
        <line x1="-3" y1="60" x2="0" y2="60" class="axis"></line>
        <line x1="0" y1="60" x2="320" y2="60" class="grid"></line>

        <text x="-5" y="36.5" text-anchor="end">6</text>
        <line x1="-3" y1="30" x2="0" y2="30" class="axis"></line>
        <line x1="0" y1="30" x2="320" y2="30" class="grid"></line>

        <text x="-5" y="6.5" text-anchor="end">7</text>
        <line x1="-3" y1="0" x2="0" y2="0" class="axis"></line>
      </g>

      <g class="label">
        <!-- X-axis labels (1-6). Labels' Y-coordinates are adjusted to place them correctly below the axis line with adequate spacing.
             Baseline at (axis_y=210) + (margin=5px) + (half_font_size=6.5px) = 221.5px. -->
        <text x="35" y="221.5" text-anchor="middle">1</text>
        <line x1="35" y1="210" x2="35" y2="213" class="axis"></line>

        <text x="85" y="221.5" text-anchor="middle">2</text>
        <line x1="85" y1="210" x2="85" y2="213" class="axis"></line>

        <text x="135" y="221.5" text-anchor="middle">3</text>
        <line x1="135" y1="210" x2="135" y2="213" class="axis"></line>

        <text x="185" y="221.5" text-anchor="middle">4</text>
        <line x1="185" y1="210" x2="185" y2="213" class="axis"></line>

        <text x="235" y="221.5" text-anchor="middle">5</text>
        <line x1="235" y1="210" x2="235" y2="213" class="axis"></line>

        <text x="285" y="221.5" text-anchor="middle">6</text>
        <line x1="285" y1="210" x2="285" y2="213" class="axis"></line>
      </g>

      <!-- Bars, correctly positioned relative to the plot_area's (0,0) (top-left of grid) -->
      <rect x="20" y="180" width="30" height="30" class="bar"></rect>
      <rect x="70" y="30" width="30" height="180" class="bar"></rect>
      <rect x="120" y="120" width="30" height="90" class="bar"></rect>
      <rect x="170" y="120" width="30" height="90" class="bar"></rect>
      <rect x="220" y="30" width="30" height="180" class="bar"></rect>
      <rect x="270" y="180" width="30" height="30" class="bar"></rect>
    </g>
  </g>
</svg>