<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <style>
    .label { font-family: sans-serif; font-size: 14px; fill: #1f2937; }
    .grid { stroke: #e5e7eb; stroke-width: 0.5; }
    .axis { stroke: #1f2937; stroke-width: 1.5; }
    .graph-line { stroke: #8a2be2; stroke-width: 2.5; fill: none; }
    .solid-dot { fill: #8a2be2; stroke: #8a2be2; stroke-width: 1.5; }
    .open-dot { fill: #ffffff; stroke: #8a2be2; stroke-width: 1.5; }
  </style>

  <!-- Grid -->
  <g class="grid">
    <!-- Vertical lines for x from -5 to 5 -->
    <line x1="20" y1="20" x2="20" y2="160" />
    <line x1="40" y1="20" x2="40" y2="160" />
    <line x1="60" y1="20" x2="60" y2="160" />
    <line x1="80" y1="20" x2="80" y2="160" />
    <line x1="100" y1="20" x2="100" y2="160" />
    <line x1="140" y1="20" x2="140" y2="160" />
    <line x1="160" y1="20" x2="160" y2="160" />
    <line x1="180" y1="20" x2="180" y2="160" />
    <line x1="200" y1="20" x2="200" y2="160" />
    <line x1="220" y1="20" x2="220" y2="160" />
    <!-- Horizontal lines for y from -2 to 5 -->
    <line x1="20" y1="20" x2="220" y2="20" />
    <line x1="20" y1="40" x2="220" y2="40" />
    <line x1="20" y1="60" x2="220" y2="60" />
    <line x1="20" y1="80" x2="220" y2="80" />
    <line x1="20" y1="100" x2="220" y2="100" />
    <line x1="20" y1="140" x2="220" y2="140" />
    <line x1="20" y1="160" x2="220" y2="160" />
  </g>

  <!-- Axes -->
  <line class="axis" x1="20" y1="120" x2="230" y2="120" /> <!-- X-axis -->
  <polygon points="230,120 225,115 225,125" fill="#1f2937" /> <!-- X-axis arrow -->
  <text class="label" x="225" y="135">x</text>

  <line class="axis" x1="120" y1="170" x2="120" y2="10" /> <!-- Y-axis -->
  <polygon points="120,10 115,15 125,15" fill="#1f2937" /> <!-- Y-axis arrow -->
  <text class="label" x="125" y="15">y</text>

  <!-- Origin label -->
  <text class="label" x="125" y="135">0</text>

  <!-- X-axis labels -->
  <text class="label" x="16" y="135">-5</text>
  <text class="label" x="36" y="135">-4</text>
  <text class="label" x="56" y="135">-3</text>
  <text class="label" x="76" y="135">-2</text>
  <text class="label" x="96" y="135">-1</text>
  <text class="label" x="136" y="135">1</text>
  <text class="label" x="156" y="135">2</text>
  <text class="label" x="176" y="135">3</text>
  <text class="label" x="196" y="135">4</text>
  <text class="label" x="216" y="135">5</text>

  <!-- Y-axis labels -->
  <text class="label" x="100" y="25">5</text>
  <text class="label" x="100" y="45">4</text>
  <text class="label" x="100" y="65">3</text>
  <text class="label" x="100" y="85">2</text>
  <text class="label" x="100" y="105">1</text>
  <text class="label" x="94" y="145">-1</text>
  <text class="label" x="94" y="165">-2</text>

  <!-- Graph of f(x) -->
  <path class="graph-line" d="M 40 160 L 160 40" />
  <path class="graph-line" d="M 160 60 L 220 120" />

  <!-- End points -->
  <!-- Part 1: y = x+2 for x in [-4,2] -->
  <circle class="solid-dot" cx="40" cy="160" r="3.5" /> <!-- (-4, -2) -->
  <circle class="solid-dot" cx="160" cy="40" r="3.5" /> <!-- (2, 4) -->
  <!-- Part 2: y = -x+5 for x in (2,5) -->
  <circle class="open-dot" cx="160" cy="60" r="3.5" /> <!-- (2, 3) -->
  <circle class="solid-dot" cx="220" cy="120" r="3.5" /> <!-- (5, 0) -->

  <!-- Label y = f(x) -->
  <text class="label" x="80" y="80" fill="#8a2be2">y = f(x)</text>
</svg>