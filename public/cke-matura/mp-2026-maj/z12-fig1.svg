<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12.0 -12.0 424.0 424.0" font-size="14" width="424" height="424"><rect x="-12.0" y="-12.0" width="424.0" height="424.0" rx="8" fill="#ffffff"></rect>
  <rect x="0" y="0" width="400" height="400" fill="#ffffff"></rect>
  
  <style>
    .label { font-family: sans-serif; font-size: 14px; fill: #1f2937; }
    .grid { stroke: #1f2937; stroke-width: 0.5; }
    .axis { stroke: #1f2937; stroke-width: 1.5; }
    .graph-line { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .solid-dot { fill: #1f2937; stroke: #1f2937; stroke-width: 1.5; }
    .open-dot { fill: #ffffff; stroke: #1f2937; stroke-width: 1.5; }
  </style>

  <!-- Unit size: 20px per unit. Grid from x=-5 to 5, y=-5 to 5.
       Grid size: 10 units x 10 units = 200px x 200px.
       Translate to center the grid within a 400x400 viewBox.
       Grid origin (cartesian 0,0) is at SVG (100,100) within the transformed group.
       x_svg = x_origin + x_val * unit = 100 + x_val * 20
       y_svg = y_origin - y_val * unit = 100 - y_val * 20
  -->
  <g transform="translate(100, 100)"> 

  <!-- Grid lines -->
  <g class="grid">
    <!-- Vertical lines for x from -5 to 5 (SVG x: 0, 20, ..., 200) -->
    <line x1="0" y1="0" x2="0" y2="200"></line>
    <line x1="20" y1="0" x2="20" y2="200"></line>
    <line x1="40" y1="0" x2="40" y2="200"></line>
    <line x1="60" y1="0" x2="60" y2="200"></line>
    <line x1="80" y1="0" x2="80" y2="200"></line>
    <line x1="120" y1="0" x2="120" y2="200"></line>
    <line x1="140" y1="0" x2="140" y2="200"></line>
    <line x1="160" y1="0" x2="160" y2="200"></line>
    <line x1="180" y1="0" x2="180" y2="200"></line>
    <line x1="200" y1="0" x2="200" y2="200"></line>
    <!-- Horizontal lines for y from 5 to -5 (SVG y: 0, 20, ..., 200) -->
    <line x1="0" y1="0" x2="200" y2="0"></line>
    <line x1="0" y1="20" x2="200" y2="20"></line>
    <line x1="0" y1="40" x2="200" y2="40"></line>
    <line x1="0" y1="60" x2="200" y2="60"></line>
    <line x1="0" y1="80" x2="200" y2="80"></line>
    <line x1="0" y1="120" x2="200" y2="120"></line>
    <line x1="0" y1="140" x2="200" y2="140"></line>
    <line x1="0" y1="160" x2="200" y2="160"></line>
    <line x1="0" y1="180" x2="200" y2="180"></line>
    <line x1="0" y1="200" x2="200" y2="200"></line>
  </g>

  <!-- Axes -->
  <line class="axis" x1="0" y1="100" x2="210" y2="100"></line> <!-- X-axis from x=-5 to x=5.5 for arrow -->
  <polygon points="210,100 205,95 205,105" fill="#1f2937"></polygon> <!-- X-axis arrow -->
  <text class="label" x="215" y="115">x</text>

  <line class="axis" x1="100" y1="210" x2="100" y2="-10"></line> <!-- Y-axis from y=-5.5 to y=5.5 for arrow -->
  <polygon points="100,-10 95,-5 105,-5" fill="#1f2937"></polygon> <!-- Y-axis arrow -->
  <text class="label" x="105" y="-5">y</text>

  <!-- Origin label -->
  <text class="label" x="105" y="115">0</text>

  <!-- X-axis labels (centered on grid lines) -->
  <text class="label" text-anchor="middle" x="0" y="115">-5</text>
  <text class="label" text-anchor="middle" x="20" y="115">-4</text>
  <text class="label" text-anchor="middle" x="40" y="115">-3</text>
  <text class="label" text-anchor="middle" x="60" y="115">-2</text>
  <text class="label" text-anchor="middle" x="80" y="115">-1</text>
  <text class="label" text-anchor="middle" x="120" y="115">1</text>
  <text class="label" text-anchor="middle" x="140" y="115">2</text>
  <text class="label" text-anchor="middle" x="160" y="115">3</text>
  <text class="label" text-anchor="middle" x="180" y="115">4</text>
  <text class="label" text-anchor="middle" x="200" y="115">5</text>

  <!-- Y-axis labels (right-aligned to axis) -->
  <text class="label" text-anchor="end" x="90" y="5">5</text>
  <text class="label" text-anchor="end" x="90" y="25">4</text>
  <text class="label" text-anchor="end" x="90" y="45">3</text>
  <text class="label" text-anchor="end" x="90" y="65">2</text>
  <text class="label" text-anchor="end" x="90" y="85">1</text>
  <text class="label" text-anchor="end" x="90" y="125">-1</text>
  <text class="label" text-anchor="end" x="90" y="145">-2</text>
  <text class="label" text-anchor="end" x="90" y="165">-3</text>
  <text class="label" text-anchor="end" x="90" y="185">-4</text>
  <text class="label" text-anchor="end" x="90" y="205">-5</text>

  <!-- Graph of f(x) -->
  <!-- Part 1: y = x+2 for x in [-4,2] -->
  <!-- (-4, -2) -> (2, 4) in cartesian corresponds to (20, 140) -> (140, 20) in SVG -->
  <path class="graph-line" d="M 20 140 L 140 20"></path>
  <!-- Part 2: y = -x+5 for x in (2,5] -->
  <!-- (2, 3) -> (5, 0) in cartesian corresponds to (140, 40) -> (200, 100) in SVG -->
  <path class="graph-line" d="M 140 40 L 200 100"></path>

  <!-- End points -->
  <circle class="solid-dot" cx="20" cy="140" r="3.5"></circle> <!-- (-4, -2) -->
  <circle class="solid-dot" cx="140" cy="20" r="3.5"></circle> <!-- (2, 4) -->
  <circle class="open-dot" cx="140" cy="40" r="3.5"></circle> <!-- (2, 3) -->
  <circle class="solid-dot" cx="200" cy="100" r="3.5"></circle> <!-- (5, 0) -->

  <!-- Label y = f(x) -->
  <!-- Position approximately at (-2.5, 2.5) in cartesian, i.e., (50, 50) in SVG -->
  <text class="label" x="50" y="50">y = f(x)</text>
  </g>
</svg>