<svg xmlns="http://www.w3.org/2000/svg" viewBox="-9.1 -9.1 230.2 235.7" font-size="14" width="304" height="311"><rect x="-9.1" y="-9.1" width="230.2" height="235.7" rx="6.1" fill="#ffffff"></rect>
  <rect x="0" y="0" width="210" height="210" rx="5" fill="#ffffff"></rect>
  
  <style>
    .grid-line { stroke: #e0e0e0; stroke-width: 0.5; }
    .axis-line { stroke: #1f2937; stroke-width: 1.5; }
    .func-line { stroke: #8b5cf6; stroke-width: 2.5; }
    .label { font-family: sans-serif; font-size: 14px; fill: #1f2937; }
    .axis-label { font-family: sans-serif; font-size: 14px; fill: #1f2937; }
    .func-text { font-family: sans-serif; font-size: 14px; fill: #8b5cf6; }
    .arrowhead { fill: #1f2937; }
    .angle-arc { stroke: #8b5cf6; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Grid Lines -->
  <g class="grid-line">
    <!-- Vertical lines -->
    <line x1="45" y1="45" x2="45" y2="195"></line>
    <line x1="60" y1="45" x2="60" y2="195"></line>
    <line x1="75" y1="45" x2="75" y2="195"></line>
    <line x1="90" y1="45" x2="90" y2="195"></line>
    <line x1="105" y1="45" x2="105" y2="195"></line>
    <line x1="135" y1="45" x2="135" y2="195"></line>
    <line x1="150" y1="45" x2="150" y2="195"></line>
    <line x1="165" y1="45" x2="165" y2="195"></line>
    <line x1="180" y1="45" x2="180" y2="195"></line>
    <line x1="195" y1="45" x2="195" y2="195"></line>
    <!-- Horizontal lines -->
    <line x1="45" y1="45" x2="195" y2="45"></line>
    <line x1="45" y1="60" x2="195" y2="60"></line>
    <line x1="45" y1="75" x2="195" y2="75"></line>
    <line x1="45" y1="90" x2="195" y2="90"></line>
    <line x1="45" y1="105" x2="195" y2="105"></line>
    <line x1="45" y1="135" x2="195" y2="135"></line>
    <line x1="45" y1="150" x2="195" y2="150"></line>
    <line x1="45" y1="165" x2="195" y2="165"></line>
    <line x1="45" y1="180" x2="195" y2="180"></line>
    <line x1="45" y1="195" x2="195" y2="195"></line>
  </g>

  <!-- Axes -->
  <line x1="30" y1="120" x2="210" y2="120" class="axis-line"></line> <!-- x-axis -->
  <line x1="120" y1="30" x2="120" y2="210" class="axis-line"></line> <!-- y-axis -->

  <!-- Arrowheads -->
  <polyline points="207,117 210,120 207,123" class="arrowhead"></polyline> <!-- x-axis arrow -->
  <polyline points="117,33 120,30 123,33" class="arrowhead"></polyline> <!-- y-axis arrow -->

  <!-- Tick Marks and Labels -->
  <g class="label">
    <text x="115" y="132" text-anchor="middle">0</text>
    <!-- x-axis labels -->
    <text x="45" y="132" text-anchor="middle">-5</text>
    <text x="60" y="132" text-anchor="middle">-4</text>
    <text x="75" y="132" text-anchor="middle">-3</text>
    <text x="90" y="132" text-anchor="middle">-2</text>
    <text x="105" y="132" text-anchor="middle">-1</text>
    <text x="135" y="132" text-anchor="middle">1</text>
    <text x="150" y="132" text-anchor="middle">2</text>
    <text x="165" y="132" text-anchor="middle">3</text>
    <text x="180" y="132" text-anchor="middle">4</text>
    <text x="195" y="132" text-anchor="middle">5</text>
    <!-- y-axis labels -->
    <text x="110" y="195" text-anchor="end" alignment-baseline="middle">-5</text>
    <text x="110" y="180" text-anchor="end" alignment-baseline="middle">-4</text>
    <text x="110" y="165" text-anchor="end" alignment-baseline="middle">-3</text>
    <text x="110" y="150" text-anchor="end" alignment-baseline="middle">-2</text>
    <text x="110" y="135" text-anchor="end" alignment-baseline="middle">-1</text>
    <text x="110" y="105" text-anchor="end" alignment-baseline="middle">1</text>
    <text x="110" y="90" text-anchor="end" alignment-baseline="middle">2</text>
    <text x="110" y="75" text-anchor="end" alignment-baseline="middle">3</text>
    <text x="110" y="60" text-anchor="end" alignment-baseline="middle">4</text>
    <text x="110" y="45" text-anchor="end" alignment-baseline="middle">5</text>
  </g>

  <!-- Axis Labels -->
  <text x="205" y="127" class="axis-label">x</text>
  <text x="127" y="40" class="axis-label">y</text>

  <!-- Function Line: y = -1.5x - 2 -->
  <line x1="45" y1="37.5" x2="165" y2="217.5" class="func-line"></line>

  <!-- Function Label -->
  <text x="55" y="45" class="func-text">y = f(x)</text>

  <!-- Angle alpha -->
  <!-- Center of arc at x-intercept: (-4/3, 0) which is (100, 120) in SVG coords after translation -->
  <!-- Arc from negative x-axis (180 deg) to line (approx 56.31 deg CCW from negative x-axis) -->
  <path d="M 85 120 A 15 15 0 0 1 91.678 107.5215" class="angle-arc"></path>
  <text x="95" y="112" class="func-text">α</text>
</svg>