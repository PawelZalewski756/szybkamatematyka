<svg xmlns="http://www.w3.org/2000/svg" viewBox="23.0 10.2 303.3 224.6" font-size="13.97" width="304" height="225"><rect x="23.0" y="10.2" width="303.3" height="224.6" rx="8" fill="#ffffff"></rect>
  
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: #1f2937; }
    .label { font-weight: bold; }
  </style>
  <g stroke="#1f2937" stroke-width="1.5" fill="none">
    <!-- Triangle KML -->
    <path d="M 50 200 L 150 50 L 300 200 Z"></path>
    <!-- Bisector MN -->
    <line x1="150" y1="50" x2="165" y2="200"></line>
  </g>
  <g fill="#1f2937">
    <!-- Points -->
    <circle cx="50" cy="200" r="2"></circle>
    <circle cx="150" cy="50" r="2"></circle>
    <circle cx="300" cy="200" r="2"></circle>
    <circle cx="165" cy="200" r="2"></circle>
  </g>
  <g text-anchor="middle">
    <!-- Labels for points -->
    <text x="40" y="215" class="label">K</text>
    <text x="150" y="30" class="label">M</text>
    <text x="310" y="215" class="label">L</text>
    <text x="165" y="215" class="label">N</text>
    <!-- Labels for sides -->
    <text x="100" y="125" class="label">a</text>
    <text x="225" y="125" class="label">b</text>
  </g>
  <!-- Angle bisector marks -->
  <g stroke="#1f2937" stroke-width="1" fill="none">
    <!-- First arc segment for the left angle (MK to MN) -->
    <path d="M 133.37 74.93 A 30 30 0 0 1 152.97 79.85"></path>
    <!-- Second arc segment for the right angle (MN to ML) -->
    <path d="M 152.97 79.85 A 30 30 0 0 1 171.21 71.21"></path>
    
    <!-- Second, inner set of arc segments -->
    <path d="M 136.14 70.78 A 25 25 0 0 1 152.47 74.88"></path>
    <path d="M 152.47 74.88 A 25 25 0 0 1 167.68 67.68"></path>
  </g>
</svg>