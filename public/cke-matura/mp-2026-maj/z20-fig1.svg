<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <style>
    .line { stroke: #1f2937; stroke-width: 1.5; }
    .point { fill: #1f2937; stroke: #1f2937; stroke-width: 1; }
    .label { font-family: sans-serif; font-size: 16px; fill: #1f2937; text-anchor: middle; dominant-baseline: central; }
    .small-label { font-family: sans-serif; font-size: 14px; fill: #1f2937; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Coordinates of O, A, B, C, D and line equations -->
  <!-- Parallel lines k (y=85) and l (y=205) -->
  <!-- Transversal m (AC): 3x - 5y = -125 -->
  <!-- Transversal n (DB): 3x + 4y = 1180 -->
  <!-- Intersection O = (200, 145) -->
  <!-- A = (100, 85) -->
  <!-- C = (300, 205) -->
  <!-- D = (280, 85) -->
  <!-- B = (120, 205) -->

  <!-- Parallel lines k and l (extended beyond the segment intersections) -->
  <line x1="0" y1="85" x2="400" y2="85" class="line"/>
  <line x1="0" y1="205" x2="400" y2="205" class="line"/>

  <!-- Transversal m (AC) (extended beyond the points A and C) -->
  <line x1="0" y1="25" x2="400" y2="265" class="line"/>

  <!-- Transversal n (DB) (extended beyond the points D and B) -->
  <line x1="0" y1="295" x2="400" y2="-5" class="line"/>

  <!-- Points -->
  <circle cx="100" cy="85" r="3" class="point"/>
  <text x="90" y="80" class="label">A</text>

  <circle cx="300" cy="205" r="3" class="point"/>
  <text x="310" y="210" class="label">C</text>

  <circle cx="280" cy="85" r="3" class="point"/>
  <text x="290" y="80" class="label">D</text>

  <circle cx="120" cy="205" r="3" class="point"/>
  <text x="110" y="210" class="label">B</text>

  <circle cx="200" cy="145" r="3" class="point"/>
  <text x="200" y="155" class="label">O</text>

  <!-- Line labels -->
  <text x="370" y="75" class="label">k</text>
  <text x="370" y="215" class="label">l</text>
  <text x="30" y="240" class="label">m</text>
  <text x="30" y="50" class="label">n</text>
  
  <!-- Length labels (OA, OC, OB) -->
  <text x="150" y="115" class="small-label">12</text>
  <text x="250" y="175" class="small-label">8</text>
  <text x="160" y="175" class="small-label">6</text>
</svg>