name: CI

# Pipeline jakości i produkcyjnego wdrożenia.
# Na master: CI -> migracje Supabase -> wdrożenie Vercel.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Anuluj starsze przebiegi dla tej samej gałęzi/PR, aby nie marnować runnerów.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    # ENV W CI - świadomie BEZ sekretów.
    # Aplikacja czyta zmienne (Supabase/Stripe/Gemini) wyłącznie leniwie, wewnątrz
    # funkcji, z bezpiecznymi strażnikami (np. isSupabaseConfigured / isStripeConfigured),
    # więc żaden moduł nie rzuca wyjątku na etapie importu/buildu. Sprawdzono empirycznie:
    # `next build` przechodzi czysto przy KOMPLETNYM braku zmiennych (brak .env*), a strony
    # SSG (generateStaticParams) korzystają z lokalnych danych, nie z Supabase.
    # Dlatego NIE ustawiamy tutaj żadnych zaślepek env - build jest deterministyczny bez nich.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Wersja Node spójna z lokalnym środowiskiem (v22) i polem "engines"
          # w package.json. Node 22 to aktualne LTS i spełnia wymagania Next.js 16.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Audit privacy (PII + secrets)
        run: npm run audit:privacy

      - name: Status docs up to date
        run: npm run status:check

      - name: Audit question quality
        run: npm run audit:questions

      - name: Audit task cache
        run: npm run audit:tasks-cache

      - name: Audit task placement
        run: npm run audit:placement

      - name: Audit CKE solutions
        run: npm run audit:cke -- --strict

      - name: Audit rendering (DB + cache + CKE)
        run: npm run audit:render

      - name: Build
        run: npm run build

  e2e:
    name: Playwright smoke
    needs: quality
    # Playwright 1.60 nie wspiera jeszcze Ubuntu 26.04 (nowy domyślny
    # ubuntu-latest), więc przypinamy 24.04 dla powtarzalnej instalacji.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run E2E smoke tests
        run: npm run test:e2e

  production-preflight:
    name: Verify production deployment access
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    outputs:
      vercel_configured: ${{ steps.vercel_secrets.outputs.configured }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify Vercel deployment secrets
        id: vercel_secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Brak sekretów Vercel - deploy wykona integracja Git w Vercel. Migracje nadal działają."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI
        if: steps.vercel_secrets.outputs.configured == 'true'
        run: npm install --global vercel@65.12.1

      - name: Verify Vercel project access
        if: steps.vercel_secrets.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

  production-migrations:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [quality, e2e, production-preflight]
    uses: ./.github/workflows/supabase-migrations.yml
    secrets:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  production-deploy:
    name: Deploy production to Vercel
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.production-preflight.outputs.vercel_configured == 'true'
    needs: [quality, e2e, production-migrations, production-preflight]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Vercel CLI
        run: npm install --global vercel@65.12.1

      - name: Build and deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
