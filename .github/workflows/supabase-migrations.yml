name: Supabase migrations

on:
  workflow_call:
    secrets:
      SUPABASE_DB_URL:
        required: true

permissions:
  contents: read

concurrency:
  group: supabase-migrations-master
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply new Supabase migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply pending migrations
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error::Add SUPABASE_DB_URL as a GitHub Actions repository secret."
            exit 1
          fi
          if [[ ! "${CURRENT_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not determine the current commit SHA."
            exit 1
          fi

          psql "$SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --command "
              create table if not exists public.app_migration_history (
                version text primary key,
                checksum text not null,
                applied_at timestamptz not null default now()
              );
              revoke all on table public.app_migration_history
                from public, anon, authenticated;
              create table if not exists public.app_deployment_history (
                id boolean primary key default true check (id),
                commit_sha text not null check (commit_sha ~ '^[0-9a-f]{40}$'),
                updated_at timestamptz not null default now()
              );
              revoke all on table public.app_deployment_history
                from public, anon, authenticated;
            "

          last_successful_sha="$(
            psql "$SUPABASE_DB_URL" \
              --no-psqlrc \
              --tuples-only \
              --no-align \
              --set ON_ERROR_STOP=1 \
              --command "select commit_sha from public.app_deployment_history where id = true;"
          )"

          if [[ -n "$last_successful_sha" ]]; then
            if [[ ! "$last_successful_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The last successful deployment SHA in Supabase is invalid."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$last_successful_sha" "$CURRENT_SHA"; then
              echo "::error::The last successful migration commit is not an ancestor of this push. Refusing to deploy after rewritten history."
              exit 1
            fi
            base_sha="$last_successful_sha"
          elif [[ "${BEFORE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] &&
               [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$BEFORE_SHA"
          else
            echo "::error::No migration baseline is available. Refusing to deploy."
            exit 1
          fi

          migrations=()

          while IFS=$'\t' read -r status migration renamed_path; do
            case "$status" in
              A|M) ;;
              D)
                if [[ "$migration" =~ ^supabase/migrations/[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
                  echo "::error::Timestamped migration was deleted: $migration"
                  exit 1
                fi
                continue
                ;;
              R*)
                if [[ "$migration" =~ ^supabase/migrations/[0-9]{14}_[a-z0-9_]+\.sql$ ]] ||
                   [[ "$renamed_path" =~ ^supabase/migrations/[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
                  echo "::error::Timestamped migrations cannot be renamed: $migration -> $renamed_path"
                  exit 1
                fi
                continue
                ;;
              *) continue ;;
            esac
            [[ "$migration" =~ ^supabase/migrations/[0-9]{14}_[a-z0-9_]+\.sql$ ]] || continue
            migrations+=("$migration")
          done < <(
            git diff \
              --find-renames \
              --name-status \
              "$base_sha" \
              "$CURRENT_SHA" \
              -- supabase/migrations
          )

          declare -A seen=()
          for migration in "${migrations[@]}"; do
            [[ -f "$migration" ]] || continue
            [[ "$migration" =~ ^supabase/migrations/([0-9]{14}_[a-z0-9_]+)\.sql$ ]] || {
              echo "::error::Refusing migration with an invalid timestamped filename: $migration"
              exit 1
            }

            version="${BASH_REMATCH[1]}"
            [[ -n "${seen[$version]:-}" ]] && continue
            seen[$version]=1
            checksum="$(sha256sum "$migration" | cut -d ' ' -f 1)"

            existing_checksum="$(
              psql "$SUPABASE_DB_URL" \
                --no-psqlrc \
                --tuples-only \
                --no-align \
                --set ON_ERROR_STOP=1 \
                --command "select checksum from public.app_migration_history where version = '$version';"
            )"

            if [[ -n "$existing_checksum" ]]; then
              if [[ "$existing_checksum" != "$checksum" ]]; then
                echo "::error::Applied migration $version has changed. Add a new migration instead of editing it."
                exit 1
              fi
              echo "Already applied: $version"
              continue
            fi

            echo "Applying: $version"
            {
              cat "$migration"
              printf "insert into public.app_migration_history (version, checksum) values ('%s', '%s');\n" \
                "$version" "$checksum"
            } | psql "$SUPABASE_DB_URL" \
              --no-psqlrc \
              --set ON_ERROR_STOP=1 \
              --single-transaction
          done

          psql "$SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --command "
              insert into public.app_deployment_history (id, commit_sha)
              values (true, '$CURRENT_SHA')
              on conflict (id) do update
                set commit_sha = excluded.commit_sha,
                    updated_at = now();
            "
